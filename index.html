<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El comerciante del Calabozo</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--ink:#1b1410;--mute:#6b5d52;--acc:#c82b5b;--accink:#fff;--warn:#c2410c;--line:#dccdb0;--amb:#a16207;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110f;--card:#241a17;--ink:#f3e9d8;--mute:#b3a291;--acc:#f0668b;--accink:#2a0a14;--warn:#ff9a5c;--line:#3d2d27;--amb:#f0b34a}}
:root[data-theme="dark"]{--bg:#17110f;--card:#241a17;--ink:#f3e9d8;--mute:#b3a291;--acc:#f0668b;--accink:#2a0a14;--warn:#ff9a5c;--line:#3d2d27;--amb:#f0b34a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:14px}
h1,h2,.big{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.01em}
h1{font-size:25px;margin:4px 0 12px}
h2{font-size:18px;margin:18px 0 8px}
.top{max-width:640px;margin:0 auto;padding:12px 14px 0;display:flex;align-items:center;gap:12px}
.top img{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:#fff;flex:none}
.top b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:19px;line-height:1.1;display:block}
.top small{color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--accink);cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.danger{background:var(--warn);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.prod{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:4px;position:relative}
.prod b{font-size:17px}.prod span{color:var(--mute);font-weight:500;font-size:15px}
.prod .pr{color:var(--acc);font-size:19px;font-weight:800}
.prod.out{opacity:.45}
.badge{position:absolute;top:8px;right:8px;background:var(--acc);color:var(--accink);border-radius:99px;min-width:26px;text-align:center;padding:2px 8px;font-size:15px;font-style:normal}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.line{display:flex;align-items:center;gap:8px;justify-content:space-between}
.low{color:var(--warn);font-weight:700}
.q{display:flex;align-items:center;gap:8px}.q button{padding:6px 14px;font-size:20px}.q b{min-width:2ch;text-align:center}
.f{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label{font-size:13px;color:var(--mute);display:block}
.big{font-size:36px;color:var(--acc);line-height:1}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;border:2px solid var(--line)}
.chip.imp{color:var(--amb);border-color:var(--amb)}.chip.lis{color:var(--acc);border-color:var(--acc)}
.cart{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--acc);padding:10px 14px;z-index:5}
.cart .in{max-width:640px;margin:0 auto}
.cart ul{list-style:none;margin:0 0 8px;padding:0;max-height:22vh;overflow:auto}
.cart li{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border-radius:0;background:transparent;color:var(--mute);padding:18px 0;font-size:14px}
nav button[aria-selected=true]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.mut{color:var(--mute);display:block;margin-top:8px;font-size:14px}
details.card summary{cursor:pointer;font-weight:700}
.res .line{padding:4px 0}.res .sum{border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.banner{background:var(--card);border:2px solid var(--warn);border-radius:12px;padding:10px;margin-bottom:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main id="v"><p class="empty">Cargando…</p></main>
<div id="cartbar"></div>
<div id="toast" role="status"></div>
<nav role="tablist">
  <button role="tab" data-t="sell">Vender</button>
  <button role="tab" data-t="ord">Pedidos</button>
  <button role="tab" data-t="inv">Inventario</button>
  <button role="tab" data-t="quote">Cotizar</button>
  <button role="tab" data-t="rep">Reporte</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
let db=null,ro=false,P=[],F=[],O=[],S=[],cart={},tab='sell',q='',armed='',busy=false;
const prod=id=>P.find(p=>p.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
async function w(fn,ok){if(ro){toast('Tu acceso es solo de lectura');return false}
  try{await fn();if(ok)toast(ok);return true}catch(e){toast('No se pudo guardar. Intenta de nuevo.');return false}}
const upd=(path,data)=>w(()=>db.doc(path).update(data));

function listen(name,set,order){
  let c=db.collection(name);if(order)c=c.orderBy(order,'desc').limit(300);
  c.onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));refresh()},()=>toast('Se perdió la conexión con los datos'));
}
function refresh(){
  if(tab==='sell'){drawGrid()}
  else if(document.activeElement&&document.activeElement.tagName==='INPUT'&&$('#v').contains(document.activeElement))return;
  else go(tab,true);
  bar();
}

/* VENDER */
function sellView(){
  $('#v').innerHTML=`<h1>Vender</h1><input id="q" type="search" placeholder="Buscar producto" value="${esc(q)}" aria-label="Buscar producto"><div id="grid"></div>`;
  $('#q').oninput=e=>{q=e.target.value;drawGrid()};drawGrid();
}
function drawGrid(){
  const g=$('#grid');if(!g)return;
  const list=P.filter(p=>String(p.n).toLowerCase().includes(q.toLowerCase()));
  g.innerHTML=list.length?`<div class="grid">${list.map(p=>`<button class="prod ${p.s<=0?'out':''}" data-add="${p.id}" ${p.s<=0?'disabled':''}>
   ${cart[p.id]?`<i class="badge">${cart[p.id]}</i>`:''}<b>${esc(p.n)}</b><span class="pr">${money(p.p)}</span>
   <span class="${p.s<=p.m?'low':''}">${p.s<=0?'Agotado':p.s+' en stock'}</span></button>`).join('')}</div>`
   :'<p class="empty">Aún no hay productos. Agrégalos en Inventario.</p>';
  g.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.add);
    if((cart[p.id]||0)>=p.s){toast('No hay más stock de '+p.n);return}
    cart[p.id]=(cart[p.id]||0)+1;drawGrid();bar()});
}
const cartIds=()=>Object.keys(cart).filter(id=>prod(id));
const cartTotal=()=>cartIds().reduce((a,id)=>a+prod(id).p*cart[id],0);
function bar(){
  const ids=cartIds();
  if(tab!=='sell'||!ids.length){$('#cartbar').innerHTML='';return}
  $('#cartbar').innerHTML=`<div class="cart"><div class="in"><ul>${ids.map(id=>{const p=prod(id);return `<li><span>${esc(p.n)}</span>
   <span class="q"><button class="ghost" data-m="${id}" aria-label="Quitar uno">−</button><b>${cart[id]}</b><button class="ghost" data-p="${id}" aria-label="Agregar uno">+</button></span></li>`}).join('')}</ul>
   <div class="line"><div><small>Total</small><div class="big">${money(cartTotal())}</div></div>
   <span><button class="ghost" id="clr">Vaciar</button> <button id="pay" ${busy?'disabled':''}>Cobrar</button></span></div></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;if(--cart[i]<=0)delete cart[i];drawGrid();bar()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=b.dataset.p;if(cart[i]<prod(i).s)cart[i]++;drawGrid();bar()});
  $('#clr').onclick=()=>{cart={};drawGrid();bar()};
  $('#pay').onclick=async()=>{
    if(busy)return;busy=true;bar();
    const ids=cartIds(),items=ids.map(id=>({n:prod(id).n,q:cart[id],p:prod(id).p})),total=cartTotal();
    const ok=await w(async()=>{
      for(const id of ids)await db.doc('products/'+id).update({s:Math.max(0,prod(id).s-cart[id])});
      await db.collection('sales').add({t:Date.now(),total,items});
    },'Venta registrada: '+money(total));
    busy=false;if(ok)cart={};drawGrid();bar();
  };
}

/* PEDIDOS */
const ST={pend:['Pendiente','Empezar a imprimir','imp'],imp:['Imprimiendo','Marcar listo','lis'],lis:['Listo para entregar','Entregado y cobrado','ent']};
function ordView(){
  const open=O.filter(o=>o.st!=='ent').sort((a,b)=>a.t-b.t);
  $('#v').innerHTML=`<h1>Pedidos</h1>
  <div class="card"><b>Nuevo pedido</b>
   <div class="f2"><div><label for="oc">Cliente</label><input id="oc"></div><div><label for="op">Precio</label><input id="op" type="number" inputmode="decimal" min="0"></div></div>
   <div style="margin-top:8px"><label for="od">¿Qué hay que imprimir?</label><input id="od" placeholder="Ej. Soporte para audífonos, PLA negro"></div>
   <p style="margin:10px 0 0"><button id="oadd">Guardar pedido</button></p></div>
  ${open.length?open.map(o=>`<div class="card"><div class="line"><b>${esc(o.c||'Sin nombre')}</b><span class="chip ${ST[o.st][2]}">${ST[o.st][0]}</span></div>
   <div style="margin:4px 0 8px">${esc(o.d)}</div><div class="line"><b>${money(o.p)}</b><span>
   <button class="${armed==='o'+o.id?'danger':'ghost'}" data-od="${o.id}">${armed==='o'+o.id?'¿Seguro?':'Quitar'}</button>
   <button data-adv="${o.id}">${ST[o.st][1]}</button></span></div></div>`).join(''):'<p class="empty">No hay pedidos pendientes.</p>'}`;
  $('#oadd').onclick=async()=>{const d=$('#od').value.trim(),c=$('#oc').value.trim();if(!d&&!c){toast('Escribe al menos el cliente o qué imprimir');return}
    if(await w(()=>db.collection('orders').add({c,d,p:+$('#op').value||0,st:'pend',t:Date.now()}),'Pedido guardado')){}};
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>{const o=O.find(x=>x.id===b.dataset.adv);
    const next={pend:'imp',imp:'lis',lis:'ent'}[o.st];upd('orders/'+o.id,next==='ent'?{st:next,dt:Date.now()}:{st:next})});
  document.querySelectorAll('[data-od]').forEach(b=>b.onclick=()=>{const k='o'+b.dataset.od;
    if(armed===k){armed='';w(()=>db.doc('orders/'+b.dataset.od).delete())}else{armed=k;ordView()}});
}

/* INVENTARIO */
function invView(){
  $('#v').innerHTML=`<h1>Inventario</h1><h2>Productos terminados</h2>
  <div class="card"><b>Nuevo producto</b><div class="f"><div><label for="nn">Nombre</label><input id="nn"></div>
  <div><label for="np">Precio</label><input id="np" type="number" inputmode="decimal" min="0"></div>

/* COTIZAR */
const DEF={t:'PLA Plus',kg:600,kwh:14,w:126,mg:200,rep:2000,vida:10000};
let QS={...DEF},QJ={c:'',d:'',h:'',g:'',stl:'',pz:'1'},qopen=false;
const nm=v=>parseFloat(v)||0;
function qcalc(){
  const h=nm(QJ.h),g=nm(QJ.g),stl=nm(QJ.stl),pz=Math.max(1,Math.round(nm(QJ.pz))||1);
  const mat=nm(QS.kg)*g/1000,el=nm(QS.w)*h/1000*nm(QS.kwh),wear=nm(QS.vida)>0?nm(QS.rep)/nm(QS.vida)*h:0;
  const sub=mat+el+wear+stl,total=sub*(1+nm(QS.mg)/100);
  return{mat,el,wear,stl,sub,total,pz,each:total/pz};
}
function drawQ(){
  const e=$('#qres');if(!e)return;const r=qcalc();
  e.innerHTML=`<div class="line"><span>Material</span><b>${money(r.mat)}</b></div>
   <div class="line"><span>Electricidad</span><b>${money(r.el)}</b></div>
   <div class="line"><span>Desgaste de la impresora</span><b>${money(r.wear)}</b></div>
   ${r.stl>0?`<div class="line"><span>Costo del STL</span><b>${money(r.stl)}</b></div>`:''}
   <div class="line"><span>Subtotal sin utilidad</span><b>${money(r.sub)}</b></div>
   <div class="sum"><small>Total a cobrar (margen ${nm(QS.mg)}%)</small><div class="big">${money(r.total)}</div></div>
   <div class="line" style="margin-top:8px"><span>Precio por pieza (${r.pz} ${r.pz===1?'pieza':'piezas'})</span><b>${money(r.each)}</b></div>`;
}
function quoteView(){
  const inp=(id,l,k,extra='')=>`<div><label for="${id}">${l}</label><input id="${id}" data-j="${k}" ${extra} value="${esc(QJ[k])}"></div>`;
  const num='type="number" step="any" inputmode="decimal" min="0"';
  const set=(l,k,extra=num)=>`<div><label>${l}</label><input data-s="${k}" ${extra} value="${esc(QS[k])}"></div>`;
  $('#v').innerHTML=`<h1>Cotizar</h1>
  <div class="card"><b>Trabajo</b>
   <div class="f2">${inp('qc','Cliente (opcional)','c')}${inp('qd','Pieza o descripción','d')}</div>
   <div class="f2">${inp('qh','Horas de impresión','h',num)}${inp('qg','Peso total (g)','g',num)}</div>
   <div class="f2">${inp('qs','Costo del STL (opcional)','stl',num)}${inp('qp','Piezas','pz','type="number" step="1" inputmode="numeric" min="1"')}</div>
   <small class="mut">Las horas y los gramos son del trabajo completo. El precio por pieza reparte el total entre las piezas.</small></div>
  <div class="card res" id="qres"></div>
  <p style="margin:0 0 14px"><button id="qsave">Guardar como pedido</button></p>
  <details class="card" id="qset" ${qopen?'open':''}><summary>Parámetros del taller</summary>
   <datalist id="fl">${F.map(f=>`<option value="${esc(f.n)}">`).join('')}</datalist>
   <div class="f2">${set('Tipo de filamento','t','list="fl"')}${set('Costo por kg de filamento','kg')}</div>
   <div class="f2">${set('Precio por kWh','kwh')}${set('Consumo de la impresora (W)','w')}</div>
   <div class="f2">${set('Margen de ganancia (%)','mg')}${set('Costo de repuestos','rep')}</div>
   <div class="f2">${set('Vida útil estimada (hrs)','vida')}</div>
   <small class="mut">Estos valores se guardan en este dispositivo.</small></details>`;
  document.querySelectorAll('[data-j]').forEach(i=>i.oninput=()=>{QJ[i.dataset.j]=i.value;drawQ()});
  document.querySelectorAll('[data-s]').forEach(i=>{
    i.oninput=()=>{QS[i.dataset.s]=i.dataset.s==='t'?i.value:nm(i.value);drawQ()};
    i.onchange=()=>w(()=>db.doc('settings/quote').set(QS))});
  $('#qset').ontoggle=e=>{qopen=e.target.open};
  $('#qsave').onclick=async()=>{const r=qcalc();if(r.total<=0){toast('Primero llena las horas y el peso');return}
    const d=(r.pz>1?r.pz+'× ':'')+(QJ.d.trim()||QS.t);
    const ok=await w(()=>db.collection('orders').add({c:QJ.c.trim(),d,p:Math.round(r.total*100)/100,st:'pend',t:Date.now()}),'Pedido guardado');
    if(ok){QJ={c:'',d:'',h:'',g:'',stl:'',pz:'1'};go('ord')}};
  drawQ();
}

/* REPORTE */
function repView(){
  const d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime();
  const today=S.filter(s=>s.t>=t0),deliv=O.filter(o=>o.st==='ent'&&o.dt>=t0);
  const vt=today.reduce((a,s)=>a+s.total,0),pt=deliv.reduce((a,o)=>a+(+o.p||0),0);
  const cnt={};today.forEach(s=>s.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const lowP=P.filter(p=>p.s<=p.m),lowF=F.filter(f=>f.g<=f.m);
  const by=k=>O.filter(o=>o.st===k).length;
  $('#v').innerHTML=`<h1>Reporte de hoy</h1>
  <div class="card"><small>Ingresos de hoy</small><div class="big">${money(vt+pt)}</div>
   <small>Ventas ${money(vt)} · Pedidos entregados ${money(pt)}</small></div>
  <div class="card line"><span>Pedidos pendientes</span><b>${by('pend')}</b></div>
  <div class="card line"><span>Imprimiendo ahora</span><b>${by('imp')}</b></div>
  <div class="card line"><span>Listos para entregar</span><b>${by('lis')}</b></div>
  <h2>Más vendidos hoy</h2>${top.length?top.map(([n,c])=>`<div class="card line"><span>${esc(n)}</span><b>${c}</b></div>`).join(''):'<p class="empty">Aún no hay ventas hoy.</p>'}
  <h2>Por reponer</h2>${lowP.length+lowF.length?lowP.map(p=>`<div class="card line"><span>${esc(p.n)}</span><b class="low">${p.s} pzas</b></div>`).join('')+lowF.map(f=>`<div class="card line"><span>${esc(f.n)}</span><b class="low">${f.g} g</b></div>`).join(''):'<p class="empty">Todo el stock está bien.</p>'}
  <h2>Últimas ventas</h2>${today.slice(0,8).map(s=>`<div class="card"><div class="line"><b>${money(s.total)}</b><small>${new Date(s.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</small></div>
   <small>${s.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</small></div>`).join('')}`;
}

function go(t,keep){
  if(!keep){tab=t;armed=''}
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  ({sell:sellView,ord:ordView,inv:invView,quote:quoteView,rep:repView})[tab]();
  if(tab==='rep')backup();
  if(ro)$('#v').insertAdjacentHTML('afterbegin','<div class="banner">Modo solo lectura: puedes ver los datos pero no cambiarlos.</div>');
  bar();if(!keep)window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

/* ALMACÉN LOCAL (guarda en este navegador) */
const store=(()=>{
  const KEY='comerciante-calabozo-v1';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs={};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  const notify=n=>(subs[n]||[]).forEach(f=>f());
  const coll=n=>data[n]||(data[n]={});
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return{
    collection(n){return{_o:null,_l:null,
      orderBy(f,d){this._o=[f,d];return this},limit(l){this._l=l;return this},
      async add(o){const id=uid();coll(n)[id]=o;save();notify(n);return{id}},
      onSnapshot(cb){const run=()=>{let docs=Object.entries(coll(n)).map(([id,v])=>({id,data:()=>v}));
        if(this._o){const[f,d]=this._o;docs.sort((a,b)=>(a.data()[f]>b.data()[f]?1:-1)*(d==='desc'?-1:1))}
        if(this._l)docs=docs.slice(0,this._l);cb({docs})};
        (subs[n]=subs[n]||[]).push(run);run()}}},
    doc(path){const[n,id]=path.split('/');return{
      async update(o){const c=coll(n);if(c[id]){Object.assign(c[id],o);save();notify(n)}},
      async set(o){coll(n)[id]={...o};save();notify(n)},
      async delete(){delete coll(n)[id];save();notify(n)}}},
    export:()=>JSON.stringify(data),
    import(j){const d=JSON.parse(j);if(!d||typeof d!=='object')throw 0;data=d;save();Object.keys(subs).forEach(notify)}
  };
})();
function backup(){
  $('#v').insertAdjacentHTML('beforeend',`<h2>Respaldo</h2><div class="card"><small class="mut" style="margin:0 0 8px">Los datos viven solo en este navegador. Descarga un respaldo de vez en cuando.</small><button id="bx">Descargar respaldo</button> <button class="ghost" id="bi">Cargar respaldo</button><input type="file" id="bf" accept=".json" hidden></div>`);
  $('#bx').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([store.export()],{type:'application/json'}));a.download='respaldo-comerciante-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
  $('#bi').onclick=()=>$('#bf').click();
  $('#bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{store.import(r.result);toast('Respaldo cargado')}catch(x){toast('Archivo no válido')}};r.readAsText(f)};
}

(async()=>{
  db=store;
  if(!db){$('#v').innerHTML='<div class="banner"><b>No se pudo abrir la base de datos.</b><br>Abre este enlace desde claude.ai con tu cuenta o pide que te compartan el acceso.</div>';return}
  
  listen('products',a=>P=a);listen('filament',a=>F=a);listen('orders',a=>O=a);listen('settings',a=>{const d=a.find(x=>x.id==='quote');if(d){const{id,...r}=d;Object.assign(QS,r)}});listen('sales',a=>S=a,'t');
  go('sell');
})();
</script>
